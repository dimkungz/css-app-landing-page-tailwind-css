<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-slate-50 font-sans antialiased">
    <div class="mx-auto flex min-h-screen max-w-5xl flex-col px-6 py-8">
      <!-- Navigation -->
      <header
        class="flex items-center justify-between rounded-full border border-slate-100 bg-white px-16 py-4 shadow-sm"
      >
        <a href="#" class="text-xl font-bold tracking-tight text-slate-900 relative">
          Acme<span
            class="mb-0.5 ml-0.5 inline-block h-1.5 w-1.5 rounded-full bg-violet-600 align-baseline absolute top-[6px] right-[-6px]"
            aria-hidden="true"
          ></span>
        </a>
        <nav class="flex items-center gap-8 text-sm font-medium">
          <a
            href="#"
            class="border-b-2 border-purple-600 pb-0.5 text-purple-600"
            >Home</a
          >
          <a
            href="#"
            class="text-slate-600 transition-colors hover:text-slate-900"
            >Features</a
          >
          <a
            href="#"
            class="text-slate-600 transition-colors hover:text-slate-900"
            >Pricing</a
          >
          <a
            href="#"
            class="text-slate-600 transition-colors hover:text-slate-900"
            >Contact</a
          >
        </nav>
      </header>

      <!-- Hero -->
      <main
        class="flex flex-1 flex-col items-center justify-start py-16 text-center mt-10"
      >
        <span
          class="mb-8 inline-flex items-center gap-2 rounded-full bg-purple-100 px-4 py-1.5 text-sm font-medium text-purple-600"
        >
          <span aria-hidden="true">🌈</span>
          Acme Productivity App
        </span>

        <h1
          class="max-w-3xl text-5xl font-extrabold leading-tight tracking-tight text-slate-900 sm:text-6xl"
        >
          Boost Your
          <span class="text-purple-600">Product</span>ivity
        </h1>

        <p class="mt-6 max-w-2xl text-slate-900 text-xl font-bold">
          Streamline your workflow with our all-in-one productivity app.
        </p>

        <a
          href="#"
          class="mt-10 inline-block rounded-xl bg-slate-900 px-8 py-3.5 text-base font-semibold text-white shadow-sm transition-colors hover:bg-slate-800"
        >
          Start Free Trial
        </a>
      </main>
    </div>
  </body>
</html>
